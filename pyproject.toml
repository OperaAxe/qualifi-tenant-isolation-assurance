[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qualifi-tenant-isolation-assurance"
version = "0.1.0"
description = "A local authorization regression suite for a fictional multi-tenant SaaS API."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --junitxml=test-results/junit.xml"
markers = [
  "boundary: tenant-isolation checks",
  "rbac: role-permission checks",
  "side_effect: mutation and asynchronous-job integrity checks",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
